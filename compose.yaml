services:
  dns:
    image: internetsystemsconsortium/bind9:9.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:53:53/udp"
      - "127.0.0.1:53:53/tcp"
    volumes:
      - ./dns/named.conf:/etc/bind/named.conf:ro
      - ./dns/zones:/etc/bind/zones:ro
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: micros_scz
      POSTGRES_USER: micros
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_migracion_rutabol.sql:/docker-entrypoint-initdb.d/02_migracion_rutabol.sql:ro
      - ./database/02_migracion_rutabol.sql:/rutabol-migration.sql:ro
      - ./database/03_migracion_stripe.sql:/docker-entrypoint-initdb.d/03_migracion_stripe.sql:ro
      - ./database/04_migracion_notificaciones.sql:/docker-entrypoint-initdb.d/04_migracion_notificaciones.sql:ro
      - ./database/05_migracion_usuarios.sql:/docker-entrypoint-initdb.d/05_migracion_usuarios.sql:ro
      - ./database/05_migracion_usuarios.sql:/usuarios-migration.sql:ro
      - ./database/06_datos_operacion.sql:/docker-entrypoint-initdb.d/06_datos_operacion.sql:ro
      - ./database/06_datos_operacion.sql:/datos-operacion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micros -d micros_scz"]
      interval: 5s
      timeout: 5s
      retries: 15
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
